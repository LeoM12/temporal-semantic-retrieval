[project]
name = "project-name"
version = "0.1.0"
description = "Research repository template for experimental and documentation-driven work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Leonard Motte" }
]
dependencies = [
    "datasets>=4.8.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
