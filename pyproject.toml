[project]
name = "project-name"
version = "0.1.0"
description = "Research repository template for experimental and documentation-driven work."
readme = "README.md"
requires-python = "==3.11.15"
license = { text = "MIT" }
authors = [
  { name = "Leonard Motte" }
]
dependencies = [
    "datasets>=4.8.5",
    "faiss-cpu>=1.14.2",
    "numpy>=2.4.6",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
